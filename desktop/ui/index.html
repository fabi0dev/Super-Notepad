<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Super Note</title>
    <style>
      /* Tokens espelhados de frontend/dashboard/src/index.css para que a
         inicialização não pisque numa cor diferente da do painel. */
      :root {
        --background: #131316;
        --surface: #1a1a1f;
        --border-color: #2c2c34;
        --foreground: #dedee2;
        --muted-foreground: #a3a3ac;
        --primary-accent: #FF8A3D;
        --destructive-fg: #F0A060;
        --destructive-bg: rgba(255, 138, 61, 0.12);
      }
      /* Tema claro. O tema ESCOLHIDO chega via `window.__SUPER_NOTEPAD_BOOT_THEME__`
         (injetado pelo Tauri) e é carimbado em `data-boot-theme` no <html>,
         prevalecendo sobre o `prefers-color-scheme` (que cobre "system"). */
      @media (prefers-color-scheme: light) {
        :root:not([data-boot-theme="dark"]) {
          --background: #edf0f4;
          --surface: #ffffff;
          --border-color: #e5e9ef;
          --foreground: #1a1a1a;
          --muted-foreground: #6b7280;
          --primary-accent: #BF5710;
          --destructive-fg: #BF5710;
          --destructive-bg: rgba(191, 87, 16, 0.1);
        }
      }
      :root[data-boot-theme="light"] {
        --background: #edf0f4;
        --surface: #ffffff;
        --border-color: #e5e9ef;
        --foreground: #1a1a1a;
        --muted-foreground: #6b7280;
        --primary-accent: #BF5710;
        --destructive-fg: #BF5710;
        --destructive-bg: rgba(191, 87, 16, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--background);
        color: var(--foreground);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui,
          sans-serif;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: default;
      }

      main {
        width: 100%;
        max-width: 34rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        text-align: center;
      }

      /* Só o spinner — fade suave na entrada. */
      .boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        opacity: 0;
        transition: opacity 0.45s ease;
      }
      .boot.ready {
        opacity: 1;
      }

      .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid var(--border-color);
        border-top-color: var(--primary-accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        flex: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2.4s;
        }
      }

      /* Legenda do spinner durante o reparo — a compilação da interface pode
         levar alguns minutos, e sem isto a tela parece travada. */
      .boot-status {
        max-width: 24rem;
        font-size: 0.85rem;
        color: var(--muted-foreground);
        text-align: center;
        white-space: pre-line;
      }

      /* Superfícies se separam por luminosidade, não por sombra. */
      .error {
        width: 100%;
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding: 1.5rem 1.25rem 1.25rem;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border-color);
        border-radius: 0.75rem;
      }

      /* Corvo quebrado: o mark do Super Note tingido de VERMELHO (a silhueta vem do
         alfa via `mask`, então a cor original é ignorada), partido em duas
         metades por uma rachadura. O erro tem cara de "algo trincou". */
      .broken-crow {
        position: relative;
        width: 92px;
        height: 92px;
      }
      /* Pena de erro (motivo do app), em vermelho — sinaliza "algo trincou". */
      .broken-crow .feather {
        position: absolute;
        inset: 0;
        margin: auto;
        width: 56px;
        height: 56px;
        color: #FF8A3D;
      }

      .error-heading {
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--foreground);
      }
      .error-sub {
        margin-top: -0.5rem;
        font-size: 0.85rem;
        color: var(--muted-foreground);
      }

      .error-detail {
        margin: 0;
        width: 100%;
        max-height: 13rem;
        overflow: auto;
        padding: 0.75rem;
        text-align: left;
        background: var(--background);
        border: 1px solid var(--border-color);
        border-radius: 0.5rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 1.55;
        color: var(--muted-foreground);
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
        cursor: text;
      }

      .error-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.6rem;
      }

      button {
        align-self: center;
        padding: 0.55rem 1.1rem;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--primary-accent);
        border: 1px solid transparent;
        border-radius: 0.5rem;
        cursor: pointer;
        transition:
          filter 0.15s ease,
          opacity 0.15s ease;
      }

      button:hover {
        filter: brightness(1.08);
      }

      button:disabled {
        opacity: 0.55;
        cursor: default;
      }

      /* Ação secundária ("Tentar de novo"): sem preenchimento vermelho, separa
         a repetição simples da correção, que é a ação recomendada. */
      button.secondary {
        color: var(--foreground);
        background: transparent;
        border-color: var(--border-color);
      }
      button.secondary:hover {
        filter: none;
        background: var(--background);
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="boot" id="boot">
        <div class="spinner" id="spinner" role="status" aria-label="Iniciando"></div>
        <div class="boot-status" id="boot-status" hidden></div>
      </div>

      <section class="error" id="error" role="alert">
        <div class="broken-crow" aria-hidden="true">
          <svg
            class="feather"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 4C11 5 6 10 5 19c7 0 13-3 15-9" />
            <path d="M5 19 14 10" />
          </svg>
        </div>
        <div class="error-heading">Não consegui abrir o painel</div>
        <div class="error-sub">Algo trincou ao iniciar. O detalhe está abaixo.</div>
        <pre class="error-detail" id="error-detail"></pre>
        <div class="error-actions">
          <button type="button" id="repair">Tentar corrigir</button>
          <button type="button" id="retry" class="secondary">Tentar de novo</button>
        </div>
      </section>
    </main>

    <script>
      const spinner = document.getElementById("spinner");
      const bootStatus = document.getElementById("boot-status");
      const errorEl = document.getElementById("error");
      const errorDetail = document.getElementById("error-detail");
      const retry = document.getElementById("retry");
      const repairBtn = document.getElementById("repair");

      /* Arraste da janela. A janela é sem barra nativa (Overlay/sem moldura),
         então o splash não arrasta de graça — e `-webkit-app-region: drag` é do
         Chromium, ignorado pelo WKWebView. Espelha o painel: no `mousedown` da
         tela chamamos `start_window_drag` e o WebKit assume o resto do gesto.
         Ignora o botão e o texto de erro (que é selecionável). */
      (function () {
        let coreRef = null;
        (async function () {
          try {
            coreRef = (await tauri()).core;
          } catch (e) {}
        })();
        document.addEventListener("mousedown", function (e) {
          if (e.button !== 0) return;
          if (e.target.closest && e.target.closest("button, .error-detail")) return;
          if (!coreRef) {
            coreRef = window.__TAURI__ && window.__TAURI__.core;
            if (!coreRef) return;
          }
          try {
            coreRef.invoke("start_window_drag");
          } catch (err) {}
        });
      })();

      /* Tema (fallback): o Tauri normalmente já carimbou `data-boot-theme` no
         init script. Se não (ex.: aberto sem a ponte), resolve aqui. */
      (function () {
        try {
          if (!document.documentElement.getAttribute("data-boot-theme")) {
            var t = (window.__SUPER_NOTEPAD_BOOT_THEME__ || "system").toLowerCase();
            if (t === "system") {
              t = window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
            }
            document.documentElement.setAttribute(
              "data-boot-theme",
              t === "light" ? "light" : "dark",
            );
          }
        } catch (e) {}
        /* Sem imagem para esperar: revela o spinner de imediato. */
        var boot = document.getElementById("boot");
        if (boot) boot.classList.add("ready");
      })();

      /** Espera pela ponte global do Tauri. O limite é de relógio, não de
       *  número de tentativas: navegador ocioso estica `setTimeout` e um
       *  contador de tentativas viraria minutos de espera silenciosa. */
      async function tauri() {
        const deadline = Date.now() + 5000;
        while (!window.__TAURI__ && Date.now() < deadline) {
          await new Promise((r) => setTimeout(r, 50));
        }
        if (!window.__TAURI__) {
          throw new Error(
            "A ponte do Tauri não carregou. Rode o app por `pnpm dev` ou pelo bundle gerado, não abrindo o HTML direto.",
          );
        }
        return window.__TAURI__;
      }

      function showError(message) {
        spinner.hidden = true;
        bootStatus.hidden = true;
        bootStatus.textContent = "";
        errorDetail.textContent = String(message || "Erro desconhecido.");
        errorEl.style.display = "flex";
        retry.disabled = false;
        repairBtn.disabled = false;
        repairBtn.focus();
      }

      /* `status` opcional legenda o spinner — usado no reparo, que compila a
         interface e pode demorar. */
      function showSpinner(status) {
        errorEl.style.display = "none";
        spinner.hidden = false;
        if (status) {
          bootStatus.textContent = status;
          bootStatus.hidden = false;
        } else {
          bootStatus.hidden = true;
          bootStatus.textContent = "";
        }
      }

      /* Vai da tela local para o painel; extrai o comportamento comum entre a
         inicialização e o reparo. `url` vazia significa navegação recusada
         silenciosamente pela webview — o único caso que precisa de aviso. */
      function goToPanel(url) {
        window.location.replace(url);
        setTimeout(() => {
          showError(
            `A janela não conseguiu abrir ${url}\n\n` +
              "O painel está no ar — só a navegação foi recusada. " +
              "Abra essa URL no navegador enquanto isso.",
          );
        }, 3000);
      }

      async function start() {
        showSpinner();
        retry.disabled = true;
        repairBtn.disabled = true;

        try {
          const { core } = await tauri();
          // O token na URL vira cookie de sessão no próprio servidor do Super Note.
          // O spinner fica visível até a troca (sem fade de saída — evita o
          // "some e reaparece").
          goToPanel(await core.invoke("start_panel"));
        } catch (err) {
          showError(err && err.message ? err.message : err);
        }
      }

      /* Correção automática: pede ao backend para re-subir o painel com o PATH
         do shell de login, curando o caso "nenhum gerenciador npm/pnpm no
         PATH" que aparece quando o app é aberto pelo Finder. Pode compilar a
         interface — daí a legenda de espera. */
      async function repair() {
        showSpinner(
          "Corrigindo o ambiente e recompilando a interface…\n" +
            "Isso pode levar alguns minutos na primeira vez.",
        );
        retry.disabled = true;
        repairBtn.disabled = true;

        try {
          const { core } = await tauri();
          goToPanel(await core.invoke("repair_panel"));
        } catch (err) {
          showError(err && err.message ? err.message : err);
        }
      }

      retry.addEventListener("click", start);
      repairBtn.addEventListener("click", repair);
      start();
    </script>
  </body>
</html>
